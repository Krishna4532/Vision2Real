<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- SEO Primary Metadata -->
    <title>Vision2Real | Transform Ideas into Products</title>
    <meta
      name="description"
      content="Vision2Real validates your startup idea with multi-agent AI analysis, executes Reality Sprints, and builds production-ready products with AI + human experts."
    />
    <link rel="canonical" href="https://www.vision2real.in/" />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
    <meta name="theme-color" content="#050816" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Vision2Real" />
    <meta property="og:url" content="https://www.vision2real.in/" />
    <meta property="og:title" content="Vision2Real | Transform Ideas into Products" />
    <meta
      property="og:description"
      content="Vision2Real validates your startup idea with multi-agent AI analysis, executes Reality Sprints, and builds production-ready products with AI + human experts."
    />
    <meta property="og:image" content="https://www.vision2real.in/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Vision2Real – Transform Ideas into Products" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter Cards -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Vision2Real | Transform Ideas into Products" />
    <meta
      name="twitter:description"
      content="Vision2Real validates your startup idea with multi-agent AI analysis, executes Reality Sprints, and builds production-ready products with AI + human experts."
    />
    <meta name="twitter:image" content="https://www.vision2real.in/og-image.png" />
    <meta name="twitter:image:alt" content="Vision2Real – Transform Ideas into Products" />

    <!-- Favicon & Brand Icons -->
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Performance: DNS Prefetch & Font Preconnect -->
    <link rel="dns-prefetch" href="https://fonts.googleapis.com" />
    <link rel="dns-prefetch" href="https://fonts.gstatic.com" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <!-- Structured Data (JSON-LD) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Organization",
            "@id": "https://www.vision2real.in/#organization",
            "name": "Vision2Real",
            "url": "https://www.vision2real.in",
            "logo": "https://www.vision2real.in/logo.svg"
          },
          {
            "@type": "WebSite",
            "@id": "https://www.vision2real.in/#website",
            "url": "https://www.vision2real.in",
            "name": "Vision2Real",
            "publisher": {
              "@id": "https://www.vision2real.in/#organization"
            }
          }
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
