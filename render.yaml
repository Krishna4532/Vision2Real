# ============================================================
# Vision2Real – Render Infrastructure Blueprint
# Specification: https://render.com/docs/blueprint-spec
# ============================================================

version: "1"

# ------------------------------------------------------------
# Managed PostgreSQL Database
# ------------------------------------------------------------
databases:
  - name: vision2real-db
    databaseName: vision2real
    user: vision2real_user
    plan: starter

# ------------------------------------------------------------
# Services
# ------------------------------------------------------------
services:

  # ──────────────────────────────────────────────────────────
  # 1. FastAPI AI Engine  (Web Service / Python 3.11)
  # ──────────────────────────────────────────────────────────
  - type: web
    name: vision2real-api
    runtime: python
    plan: starter
    pythonVersion: "3.11.0"
    rootDir: ai-engine

    # Install deps, then run Alembic migrations before starting uvicorn.
    # migrations/env.py pulls VISION2REAL_DATABASE_URL_SYNC from Settings;
    # config.py normalises postgres:// → postgresql+psycopg:// automatically.
    buildCommand: pip install -r requirements.txt
    startCommand: >-
      alembic upgrade head &&
      uvicorn app.main:app --host 0.0.0.0 --port $PORT

    healthCheckPath: /health
    autoDeploy: true

    envVars:
      # ── Core ────────────────────────────────────────────────
      - key: VISION2REAL_ENVIRONMENT
        value: production

      - key: VISION2REAL_DEBUG
        value: "false"

      - key: VISION2REAL_EXECUTION_MODE
        value: v1

      # Auto-generated and stored as a Render secret.
      - key: VISION2REAL_SECRET_KEY
        generateValue: true

      # ── JWT ─────────────────────────────────────────────────
      - key: VISION2REAL_JWT_SECRET_KEY
        generateValue: true

      - key: VISION2REAL_JWT_ALGORITHM
        value: HS256

      - key: VISION2REAL_ACCESS_TOKEN_EXPIRE_MINUTES
        value: "60"

      - key: VISION2REAL_REFRESH_TOKEN_EXPIRE_DAYS
        value: "30"

      # ── Database ─────────────────────────────────────────────
      # Render supplies a postgres:// URL. config.py field_validator
      # normalises it to postgresql+asyncpg:// (async) and
      # postgresql+psycopg:// (sync / Alembic) at runtime.
      - key: VISION2REAL_DATABASE_URL
        fromDatabase:
          name: vision2real-db
          property: connectionString

      - key: VISION2REAL_DATABASE_URL_SYNC
        fromDatabase:
          name: vision2real-db
          property: connectionString

      # ── CORS ─────────────────────────────────────────────────
      # Set this manually in the Render dashboard after deploy.
      # Enter ALL origins that will call the API, e.g.:
      #   https://vision2real.in,https://www.vision2real.in,https://vision2real-web.onrender.com
      - key: VISION2REAL_ALLOWED_ORIGINS
        sync: false

      # ── LLM ──────────────────────────────────────────────────
      - key: VISION2REAL_LLM_PROVIDER
        value: auto

      - key: VISION2REAL_RESEARCH_PROVIDER
        value: tavily

      # ── Google OAuth ─────────────────────────────────────────
      - key: VISION2REAL_GOOGLE_CLIENT_ID
        sync: false

      # ── LLM API Keys  (enter in Render dashboard) ─────────────
      - key: VISION2REAL_GEMINI_API_KEY
        sync: false

      - key: VISION2REAL_OPENROUTER_API_KEY
        sync: false

      - key: VISION2REAL_GROQ_API_KEY
        sync: false

      # ── Research ─────────────────────────────────────────────
      - key: VISION2REAL_TAVILY_API_KEY
        sync: false

      # ── Admin Bootstrap  (required in production) ─────────────
      # Validated by validate_required_config() on every startup.
      # Never commit real values — enter in Render dashboard.
      - key: VISION2REAL_ADMIN_BOOTSTRAP_EMAIL
        sync: false

      - key: VISION2REAL_ADMIN_BOOTSTRAP_PASSWORD
        sync: false

  # ──────────────────────────────────────────────────────────
  # 2. React + Vite Frontend  (Static Site)
  # ──────────────────────────────────────────────────────────
  - type: web
    name: vision2real-web
    runtime: static
    plan: starter
    rootDir: web-app

    # tsc type-check then Vite production build → outputs to dist/
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    autoDeploy: true

    # SPA fallback: all paths served as index.html (React Router handles routing).
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

    headers:
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN

    envVars:
      # Read by env.ts → getRequiredEnvVar('VITE_BACKEND_URL').
      # Baked into the JS bundle at Vite build time.
      - key: VITE_BACKEND_URL
        fromService:
          type: web
          name: vision2real-api
          property: url

      - key: VITE_APP_NAME
        value: Vision2Real

      - key: VITE_APP_ENV
        value: production

      - key: VITE_ENABLE_ANALYTICS
        value: "false"
