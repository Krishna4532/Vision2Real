version: "1"

services:
  - type: web
    name: vision2real-api
    runtime: python
    plan: free
    rootDir: ai-engine

    buildCommand: pip install -r requirements.txt

    startCommand: >
      alembic upgrade head &&
      uvicorn app.main:app --host 0.0.0.0 --port $PORT

    healthCheckPath: /health

    envVars:
      - key: VISION2REAL_ENVIRONMENT
        value: production

      - key: VISION2REAL_DATABASE_URL
        sync: false

      - key: VISION2REAL_DATABASE_URL_SYNC
        sync: false

      - key: VISION2REAL_SECRET_KEY
        generateValue: true

      - key: VISION2REAL_JWT_SECRET_KEY
        generateValue: true
